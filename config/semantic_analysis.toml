# Semantic routing sensor — local GLiNER classifier, advisory only.
# Ajax deterministic policy retains final authority; any sensor failure
# degrades gracefully to deterministic routing.
# Set up the local venv + model with `scripts/setup-gliner`.
[semantic]
enabled = true
model = "fastino/GLiNER2.5-Decide"
python = ".venv/bin/python"
timeout_ms = 20000
# ponytail: 0.60 is the policy default, not data-fitted (0.45 let ~coin-flip picks route).
# Recalibrate once routing events are logged next to outcomes.
confidence_threshold = 0.60
