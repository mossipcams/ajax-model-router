# Laya semantic routing — local System-1 sensor, enabled by default.
# Laya is a sensor only: Ajax deterministic policy retains final authority.
# Degrades gracefully to deterministic routing when Laya is unreachable,
# times out, returns invalid output, or confidence is below the threshold.
[semantic]
enabled = true
endpoint = "http://127.0.0.1:8000/v1/systemone"
timeout_ms = 5000
confidence_threshold = 0.60
