# Local SLM semantic analysis — enabled by default; degrades when Ollama is unreachable (no CI dependency).

[slm]
enabled = true
endpoint = "http://127.0.0.1:11434/v1/chat/completions"
model = "qwen3:4b-instruct" # Instruct 2507 (not thinking qwen3:4b)
timeout_ms = 5000
max_retries = 1
confidence_threshold = 0.6

[prompts]
task_system = "You classify coding tasks. Reply with JSON only matching the schema. No explanation."
failure_system = "You classify execution failures. Reply with JSON only matching the schema. No explanation."
max_tokens = 256
